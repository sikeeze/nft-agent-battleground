[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# --- shared ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
mimalloc = "0.1"
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "macros",
    "migrate",
]}
tempfile = "3"
rand = { version = "0.8", features = ["std", "std_rng"] }

# --- Fase 2 (Hari 4-7): keystore, signer, policy ---
# alasan: keystore terenkripsi Argon2id+XChaCha20 sesuai blueprint §F4/§3A
# alasan: signing tx + personal_sign + EIP-712 via alloy secp256k1 (§F3)
# alasan: policy engine yang menolak intent di luar batas & memungkinkan ApprovedTx-only signing (§F5)
# consensus: tipe tx (legacy/1559) + Signed + TxEnvelope di nft-signer (§F3)
# sol-types: EIP-712 typed-data signing di nft-signer (§F3)
# eip712: sign_typed_data_sync pada SignerSync (§F3)
# k256: secp256k1 crypto backend (recover_signer + sign) — default alloy pakai k256
# alloy didefinisikan sekali di bawah (Fase 3 menambahkan feature chain layer)
# async-trait: hook konfirmasi manusia & Simulator trait async di nft-policy (§F5)
async-trait = "0.1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
hex = "0.4"
serde_bytes = "0.11"

# --- Fase 3 (Hari 8-11): chain layer ---
# reqwest: klien HTTP/2 koneksi persisten + connection pool untuk RPC (§8.2 poin 5)
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "http2",
] }
# tokio-tungstenite: WebSocket newHeads, koneksi persisten + reconnect (§8.2 poin 4-5)
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
# futures-util: Stream/Sink untuk WebSocket newHeads stream
futures-util = "0.3"
# alloy chain deps: provider WS/HTTP + RPC types + contract call untuk
# simulator eth_call dan gas EIP-1559 (§9 Fase 3). Tambahan features pada
# alloy yang sudah ada (aturan #9: tidak ada crate baru, hanya feature flags).
alloy = { version = "2", default-features = false, features = [
    "signer-local",
    "consensus",
    "sol-types",
    "eip712",
    "k256",
    "provider-http",
    "provider-ws",
    "rpc-types-eth",
    "rpc-client",
    "eips",
    "serde",
    "rlp",
    # signer-mnemonic: derivasi mnemonic BIP-39 untuk /import (§3A — agent
    # hanya menurunkan path tunggal m/44'/60'/0'/0/0; butuh coins-bip39).
    "signer-mnemonic",
] }

# --- Fase 4 (Hari 12-16): telegram ---
# teloxide: Telegram Bot framework resmi (§1 "Kanal kontrol: Telegram Bot",
# §F6 "Kontrol via Telegram") — dispatcher, dialog, inline keyboard.
teloxide = { version = "0.15", default-features = false, features = [
    "rustls",
    "ctrlc_handler",
    "macros",
] }
# totp-rs: TOTP lapis kedua untuk konfirmasi di atas nominal tertentu dan
# alur /import (§3 poin 5, §3A "Aksi ini juga minta TOTP kalau aktif").
totp-rs = { version = "5", features = ["gen_secret", "zeroize"] }

# --- Fase 6 (Hari 22-27): linkresolver, preflight ---
# url: parsing URL link mint (§5 "Mint Hanya dengan Link") — crate kecil
# untuk normalisasi domain/jalur sebelum handler platform.
url = "2"

# --- Fase 10 (Hari 45-48): REST API lokal ---
# axum: REST API lokal (§F10) — bind 127.0.0.1/VPN + Bearer token.
# Alasan: framework web resmi tokio ecosystem, ringan, kompatibel dengan
# tower middleware ( Yang dipakai tracing/rate-limit ).
axum = { version = "0.8", features = ["json"] }
# tower: middleware layer ( Axum dependency bawaan) — dibutuhkan untuk
# ServiceBuilder di API ( timeout, compression ).
tower = "0.5"
# async-trait sudah ada di atas ( dipakai policy/skills/scheduler ).

# --- Fase 7 (Hari 28-33): social vault & browser worker ---
# argon2 & chacha20poly1305 & zeroize & chrono & sqlx & tracing sudah ada
# di atas (dipakai keystore/policy/chain). Tidak ada crate baru di fase ini:
# vault memakai mesin enkripsi yang sama dengan keystore (§3B poin 1), dan
# browser worker memakai reqwest/alloy yang sudah terpasang.
# ponytail: chromiumoxide (Chromium via CDP) menyusul saat VPS siap; saat ini
# browser crate berisi provider EIP-1193 + parser SIWE yang diuji tanpa
# browser nyata (aturan keras #5: tidak ada solver captcha/anti-detect).


[profile.release]
# §8.2 poin 10: build rilis dioptimalkan untuk latensi hot path
lto = "fat"
codegen-units = 1
opt-level = 3
