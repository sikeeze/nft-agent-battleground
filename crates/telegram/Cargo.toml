[package]
name = "nft-telegram"
version.workspace = true
edition.workspace = true

[dependencies]
nft-core = { path = "../core", package = "nft-core" }
nft-policy = { path = "../policy", package = "nft-policy" }
nft-keystore = { path = "../keystore", package = "nft-keystore" }
nft-signer = { path = "../signer", package = "nft-signer" }
nft-chain = { path = "../chain", package = "nft-chain" }
nft-mint = { path = "../mint", package = "nft-mint" }
nft-linkresolver = { path = "../linkresolver", package = "nft-linkresolver" }
nft-preflight = { path = "../preflight", package = "nft-preflight" }
nft-vault = { path = "../vault", package = "nft-vault" }
nft-trader = { path = "../trader", package = "nft-trader" }
nft-llm = { path = "../llm", package = "nft-llm" }
nft-skills = { path = "../skills", package = "nft-skills" }
nft-scheduler = { path = "../scheduler", package = "nft-scheduler" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
async-trait = { workspace = true }
teloxide = { workspace = true }
totp-rs = { workspace = true }
alloy = { workspace = true }
tracing = "0.1"
rand = { workspace = true }
zeroize = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
hex = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
